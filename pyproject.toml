[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A maze generator and solver library (recursive backtracker + BFS)"
authors = [
    { name = "mnoda-ta" },
    { name = "rkato" }
]
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }

[tool.setuptools.packages.find]
include = ["mazegen*"]
